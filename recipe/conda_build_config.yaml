# cccl.c refuses to build with CUDA >= 13.4 (static_assert in
# c/parallel/src/scan.cu, NVBug 6235538), so build the CUDA 13 variants with
# 13.0 instead of the global pinning's 13.4. These keys are zipped in the
# global pinning, so the lists must keep its length (None, 12.x, 13.x).
cuda_compiler_version:  # [(linux and (x86_64 or aarch64)) or win64]
  - None                # [(linux and (x86_64 or aarch64)) or win64]
  - 12.9                # [(linux and (x86_64 or aarch64)) or win64]
  - 13.0                # [(linux and (x86_64 or aarch64)) or win64]
c_compiler_version:     # [linux and (x86_64 or aarch64)]
  - 15                  # [linux and (x86_64 or aarch64)]
  - 14                  # [linux and (x86_64 or aarch64)]
  - 14                  # [linux and (x86_64 or aarch64)]
cxx_compiler_version:   # [linux and (x86_64 or aarch64)]
  - 15                  # [linux and (x86_64 or aarch64)]
  - 14                  # [linux and (x86_64 or aarch64)]
  - 14                  # [linux and (x86_64 or aarch64)]
